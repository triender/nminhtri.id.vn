<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 8px;">
  <!-- Title & Subtitle -->
  <text x="400" y="32" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">Biểu đồ so sánh tốc độ tăng trưởng các hàm độ phức tạp (Big-O)</text>
  <text x="400" y="52" text-anchor="middle" fill="#64748b" font-size="12">Khảo sát sự thay đổi của số phép tính theo kích thước dữ liệu đầu vào (N)</text>

  <!-- Coordinate Grid Area -->
  <g transform="translate(80, 75)">
    <!-- Background Box -->
    <rect x="0" y="0" width="660" height="330" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6"/>
    
    <!-- Grid Lines -->
    <line x1="0" y1="66" x2="660" y2="66" stroke="#e2e8f0" stroke-dasharray="4" stroke-width="1"/>
    <line x1="0" y1="132" x2="660" y2="132" stroke="#e2e8f0" stroke-dasharray="4" stroke-width="1"/>
    <line x1="0" y1="198" x2="660" y2="198" stroke="#e2e8f0" stroke-dasharray="4" stroke-width="1"/>
    <line x1="0" y1="264" x2="660" y2="264" stroke="#e2e8f0" stroke-dasharray="4" stroke-width="1"/>

    <line x1="132" y1="0" x2="132" y2="330" stroke="#e2e8f0" stroke-dasharray="4" stroke-width="1"/>
    <line x1="264" y1="0" x2="264" y2="330" stroke="#e2e8f0" stroke-dasharray="4" stroke-width="1"/>
    <line x1="396" y1="0" x2="396" y2="330" stroke="#e2e8f0" stroke-dasharray="4" stroke-width="1"/>
    <line x1="528" y1="0" x2="528" y2="330" stroke="#e2e8f0" stroke-dasharray="4" stroke-width="1"/>

    <!-- Axes -->
    <line x1="0" y1="330" x2="660" y2="330" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="330" stroke="#334155" stroke-width="2"/>

    <!-- Axis Labels -->
    <text x="660" y="355" text-anchor="end" fill="#475569" font-size="12" font-weight="600">Kích thước dữ liệu (N) →</text>
    <text x="-25" y="-10" text-anchor="start" fill="#475569" font-size="12" font-weight="600">↑ Thời gian / Số phép tính</text>

    <!-- Curves -->
    <!-- O(N!) & O(N^N) - Red -->
    <path d="M 0 330 Q 15 260, 24 0" fill="none" stroke="#ef4444" stroke-width="3"/>
    <text x="30" y="25" fill="#ef4444" font-size="12" font-weight="700">O(N!)</text>

    <!-- O(2^N) - Red Orange -->
    <path d="M 0 330 Q 40 250, 65 0" fill="none" stroke="#f97316" stroke-width="3"/>
    <text x="72" y="35" fill="#f97316" font-size="12" font-weight="700">O(2^N)</text>

    <!-- O(N^2) - Orange -->
    <path d="M 0 330 Q 140 280, 220 0" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <text x="228" y="35" fill="#f59e0b" font-size="12" font-weight="700">O(N^2)</text>

    <!-- O(N log N) - Amber -->
    <path d="M 0 330 L 460 20" fill="none" stroke="#eab308" stroke-width="3"/>
    <text x="468" y="35" fill="#ca8a04" font-size="12" font-weight="700">O(N log N)</text>

    <!-- O(N) - Yellow Green -->
    <path d="M 0 330 L 640 100" fill="none" stroke="#84cc16" stroke-width="3"/>
    <text x="645" y="95" fill="#65a30d" font-size="12" font-weight="700">O(N)</text>

    <!-- O(sqrt(N)) - Teal -->
    <path d="M 0 330 Q 200 280, 640 210" fill="none" stroke="#06b6d4" stroke-width="3"/>
    <text x="645" y="210" fill="#0891b2" font-size="12" font-weight="700">O(√N)</text>

    <!-- O(log N) - Blue -->
    <path d="M 0 330 Q 150 295, 640 275" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <text x="645" y="275" fill="#2563eb" font-size="12" font-weight="700">O(log N)</text>

    <!-- O(1) - Green -->
    <line x1="0" y1="320" x2="640" y2="320" stroke="#22c55e" stroke-width="3"/>
    <text x="645" y="324" fill="#16a34a" font-size="12" font-weight="700">O(1)</text>
  </g>

  <!-- Legend Bottom Bar -->
  <g transform="translate(80, 440)">
    <circle cx="10" cy="10" r="5" fill="#22c55e"/>
    <text x="22" y="14" fill="#475569" font-size="11">Xuất sắc: O(1), O(log N)</text>

    <circle cx="185" cy="10" r="5" fill="#84cc16"/>
    <text x="197" y="14" fill="#475569" font-size="11">Tốt: O(N)</text>

    <circle cx="285" cy="10" r="5" fill="#eab308"/>
    <text x="297" y="14" fill="#475569" font-size="11">Chấp nhận: O(N log N)</text>

    <circle cx="450" cy="10" r="5" fill="#f59e0b"/>
    <text x="462" y="14" fill="#475569" font-size="11">Kém: O(N^2)</text>

    <circle cx="565" cy="10" r="5" fill="#ef4444"/>
    <text x="577" y="14" fill="#475569" font-size="11">Tệ: O(N!)</text>
  </g>
</svg>
