<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 8px;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="700">Lưu đồ thuật toán kiểm tra số nguyên tố</text>

  <!-- Start Node (Oval) -->
  <rect x="175" y="50" width="150" height="40" rx="20" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="250" y="75" text-anchor="middle" fill="#312e81" font-size="13" font-weight="600">Bắt đầu (Start)</text>

  <line x1="250" y1="90" x2="250" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Input Node (Parallelogram) -->
  <polygon points="160,160 360,160 340,120 140,120" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="250" y="145" text-anchor="middle" fill="#0f172a" font-size="13">Nhập số nguyên dương N</text>

  <line x1="250" y1="160" x2="250" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 1: N <= 1 -->
  <polygon points="250,190 350,230 250,270 150,230" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="250" y="235" text-anchor="middle" fill="#92400e" font-size="12" font-weight="600">N ≤ 1 ?</text>

  <!-- Decision 1 Yes -> False -->
  <line x1="350" y1="230" x2="430" y2="230" stroke="#334155" stroke-width="2"/>
  <line x1="430" y1="230" x2="430" y2="520" stroke="#334155" stroke-width="2"/>
  <text x="375" y="222" fill="#d97706" font-size="11" font-weight="600">Đúng</text>

  <!-- Decision 1 No -> Init i = 2 -->
  <line x1="250" y1="270" x2="250" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="288" fill="#475569" font-size="11">Sai</text>

  <!-- Process Node: i = 2 -->
  <rect x="175" y="300" width="150" height="36" fill="#f8fafc" stroke="#64748b" stroke-width="2" rx="4"/>
  <text x="250" y="323" text-anchor="middle" fill="#0f172a" font-size="13">Khởi tạo i ← 2</text>

  <line x1="250" y1="336" x2="250" y2="365" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 2: i * i <= N -->
  <polygon points="250,365 350,405 250,445 150,405" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="250" y="410" text-anchor="middle" fill="#92400e" font-size="12" font-weight="600">i * i ≤ N ?</text>

  <!-- Decision 2 No -> True (Is Prime) -->
  <line x1="150" y1="405" x2="70" y2="405" stroke="#334155" stroke-width="2"/>
  <line x1="70" y1="405" x2="70" y2="520" stroke="#334155" stroke-width="2"/>
  <text x="110" y="398" fill="#475569" font-size="11">Sai</text>

  <!-- Decision 2 Yes -> Decision 3: N % i == 0 -->
  <line x1="250" y1="445" x2="250" y2="475" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="462" fill="#d97706" font-size="11" font-weight="600">Đúng</text>

  <!-- Decision 3: N % i == 0 -->
  <polygon points="250,475 350,515 250,555 150,515" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="250" y="520" text-anchor="middle" fill="#92400e" font-size="12" font-weight="600">N mod i = 0 ?</text>

  <!-- Decision 3 Yes -> False -->
  <line x1="350" y1="515" x2="430" y2="515" stroke="#334155" stroke-width="2"/>
  <text x="375" y="508" fill="#d97706" font-size="11" font-weight="600">Đúng</text>

  <!-- Decision 3 No -> Increment i = i + 1 and loop back -->
  <line x1="150" y1="515" x2="110" y2="515" stroke="#334155" stroke-width="2"/>
  <line x1="110" y1="515" x2="110" y2="350" stroke="#334155" stroke-width="2"/>
  <line x1="110" y1="350" x2="240" y2="350" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="115" y="490" fill="#475569" font-size="11">Sai: i ← i + 1</text>

  <!-- Output Nodes -->
  <!-- Return True -->
  <rect x="20" y="520" width="100" height="35" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="70" y="542" text-anchor="middle" fill="#15803d" font-size="12" font-weight="700">Trả về True</text>

  <!-- Return False -->
  <rect x="380" y="520" width="100" height="35" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="430" y="542" text-anchor="middle" fill="#b91c1c" font-size="12" font-weight="700">Trả về False</text>

  <!-- End Node -->
  <line x1="70" y1="555" x2="70" y2="585" stroke="#334155" stroke-width="2"/>
  <line x1="430" y1="555" x2="430" y2="585" stroke="#334155" stroke-width="2"/>
  <line x1="70" y1="585" x2="430" y2="585" stroke="#334155" stroke-width="2"/>
  <line x1="250" y1="585" x2="250" y2="595" stroke="#334155" stroke-width="2"/>

  <rect x="175" y="590" width="150" height="26" rx="13" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="250" y="608" text-anchor="middle" fill="#312e81" font-size="12" font-weight="600">Kết thúc (End)</text>
</svg>
